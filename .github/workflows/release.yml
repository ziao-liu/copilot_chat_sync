name: Windows Preview Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts
      - name: Verify artifact hashes
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.exe artifacts/*.zip artifacts/*.png artifacts/SHA256SUMS.txt \
            --verify-tag --draft --prerelease --title "Copilot Chat Sync $RELEASE_TAG (Windows preview)" \
            --notes-file docs/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false