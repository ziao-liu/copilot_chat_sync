name: Test and Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Test native fixtures and safety boundaries
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test workspace hierarchy and selection
        run: node tests/test_workspace_tree.js
      - name: Verify module and installed CLI
        run: |
          python -m copilot_chat_sync --version
          copilot-chat-sync --help
      - name: Build distribution
        run: python -m pip wheel --no-deps --wheel-dir dist .
