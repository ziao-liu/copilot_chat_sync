[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-chat-sync"
version = "0.1.0"
description = "Conservative, offline-first synchronization of legacy VS Code Copilot chats"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["psutil>=5.9,<8"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Programming Language :: Python :: 3",
	"Operating System :: Microsoft :: Windows",
	"Operating System :: POSIX :: Linux",
	"Operating System :: MacOS",
]

[project.scripts]
copilot-chat-sync = "copilot_chat_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
copilot_chat_sync = ["web/*", "web/vendor/*"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
